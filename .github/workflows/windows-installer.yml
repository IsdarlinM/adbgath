name: windows-installer-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "installers/windows/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  clean-user-install:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Regression-test Python candidate rejection
        shell: powershell
        run: |
          $source = Get-Content .\installers\windows\install.ps1 -Raw
          $start = $source.IndexOf("function Test-Python311")
          $end = $source.IndexOf("function Resolve-Python")
          if ($start -lt 0 -or $end -le $start) { throw "Unable to extract Test-Python311 from installer." }
          Invoke-Expression $source.Substring($start, $end - $start)

          $fakePython = Join-Path $env:RUNNER_TEMP "fake-python.cmd"
          @"
          @echo off
          echo Python 3.99 not found!
          exit /b 103
          "@ | Set-Content -Path $fakePython -Encoding ASCII

          if (Test-Python311 $fakePython @()) {
            throw "Unavailable Python candidates must never be accepted because they printed output."
          }

          $realPython = (Get-Command python.exe -ErrorAction Stop).Source
          if (-not (Test-Python311 $realPython @())) {
            throw "The available Python runtime was unexpectedly rejected."
          }
      - name: Run current-user installer
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "adbgath-install"
          & .\installers\windows\install.ps1 -InstallRoot $root -SkipFrida -SkipBundletool -NoPathChanges -Force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $root "bin\adbgath.cmd") --version
          & (Join-Path $root "bin\adbgath.cmd") --json doctor
          & (Join-Path $root "bin\adbgath-web.cmd") --help
      - name: Repair installation
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "adbgath-install"
          & .\installers\windows\install.ps1 -InstallRoot $root -SkipFrida -SkipBundletool -NoPathChanges -Repair
          & (Join-Path $root "bin\adbgath.cmd") --version
      - name: Uninstall with a managed executable locked
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "adbgath-install"
          $platformTools = Join-Path $root "platform-tools"
          $lockExe = Join-Path $platformTools "adb-lock-test.exe"
          $ping = (Get-Command ping.exe -ErrorAction Stop).Source
          Copy-Item -LiteralPath $ping -Destination $lockExe -Force
          $locked = Start-Process -FilePath $lockExe -ArgumentList @("-n", "30", "127.0.0.1") -WindowStyle Hidden -PassThru
          Start-Sleep -Milliseconds 500
          if ($locked.HasExited) { throw "Lock-test process exited before uninstall regression could run." }

          & .\installers\windows\uninstall.ps1 -InstallRoot $root
          if (Test-Path $root) { throw "Installer root still exists after uninstall." }
          Start-Sleep -Milliseconds 250
          if (Get-Process -Id $locked.Id -ErrorAction SilentlyContinue) {
            throw "Managed process is still running after uninstall."
          }
