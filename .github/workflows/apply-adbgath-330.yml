name: apply-adbgath-330

on:
  push:
    branches:
      - agent/adbgath-3.3.0-release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adbgath-330-release
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adbgath-3.3.0-release
          fetch-depth: 0

      - name: Apply ADB-Gath 3.3.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part-* | base64 --decode | xz --decompress > "$RUNNER_TEMP/adbgath-3.3.0.patch"
          patch -p2 --batch --forward < "$RUNNER_TEMP/adbgath-3.3.0.patch"
          rm -rf .release
          rm -f .github/workflows/apply-adbgath-330.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          python -m compileall -q src
          pytest -q
          node --check src/adbgath/web/static/app.js
          python -m build
          test "$(python -c 'from adbgath import __version__; print(__version__)')" = "3.3.0"

      - name: Publish validated commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: release ADB-Gath 3.3.0 with secure wireless pairing"
          git push origin HEAD:agent/adbgath-3.3.0-release
